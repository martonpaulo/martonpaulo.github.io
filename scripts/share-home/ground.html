<!doctype html>
<!-- The ground of the home share image: the site's page glow and every product's icon on a wall
     leaning back in perspective, dimmed and softly out of focus so the name leads. satori cannot
     draw 3D transforms or blur, so this is rendered once and committed; og/[id].png.ts writes the
     copy over it. The arrangement is the owner's (2026-09-11): rows of three and four interlock,
     the second row's fourth place stays empty. Colours mirror src/styles/tokens.scss.
     Render: npm run share-ground   (writes src/assets/share/home-ground.png) -->
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
  }
  .ground {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(900px 620px at 8% -10%, rgba(42, 111, 143, 0.75), transparent 62%),
      radial-gradient(760px 560px at 105% 110%, rgba(43, 138, 122, 0.6), transparent 60%), #172630;
  }
  .wall {
    position: absolute;
    left: 661px;
    top: -84px;
    width: 798px;
    height: 798px;
    transform: perspective(1200px) rotateX(38deg) rotateZ(-24deg);
    transform-origin: 50% 50%;
    opacity: 0.55;
    filter: blur(1.2px);
  }
  .wall img {
    position: absolute;
    width: 168px;
    height: 168px;
    box-shadow: 0 18px 36px rgba(5, 12, 18, 0.45);
    border-radius: 38px;
  }
</style>
<div class="ground">
  <div class="wall">
    <img src="../../src/assets/share/tabelo.png" alt="" style="left: 105px; top: 0px" />
    <img src="../../src/assets/share/mailbell.png" alt="" style="left: 315px; top: 0px" />
    <img src="../../src/assets/share/meantime.png" alt="" style="left: 525px; top: 0px" />
    <img src="../../src/assets/share/atlas-tint.png" alt="" style="left: 0px; top: 210px" />
    <img src="../../src/assets/share/todo-print.png" alt="" style="left: 210px; top: 210px" />
    <img src="../../src/assets/share/windowhop.png" alt="" style="left: 420px; top: 210px" />
    <img src="../../src/assets/share/orbit.png" alt="" style="left: 105px; top: 420px" />
    <img src="../../src/assets/share/country-badge.png" alt="" style="left: 315px; top: 420px" />
    <img src="../../src/assets/share/issues-graph.png" alt="" style="left: 525px; top: 420px" />
    <img src="../../src/assets/share/smart-desk.png" alt="" style="left: 0px; top: 630px" />
    <img src="../../src/assets/share/linguae.png" alt="" style="left: 210px; top: 630px" />
    <img src="../../src/assets/share/lights.png" alt="" style="left: 420px; top: 630px" />
    <img src="../../src/assets/share/moon-uniform.png" alt="" style="left: 630px; top: 630px" />
  </div>
</div>
