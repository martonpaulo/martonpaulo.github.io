name: Deploy

on:
  # Deploy never revalidates: it waits for Validate to pass on the default
  # branch and publishes that commit.
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:
  # The site states facts that age without a commit: the years worked in the
  # bio (counted from careerStart in db/person.json) and the footer's year.
  # A monthly rebuild keeps both current, and has no prior Validate to wait
  # for, so it is a direct trigger.
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Validate approved; empty (the default branch) for the
          # schedule and the manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Expensive: the build renders one share image per page with satori and
      # resvg. Its artifact is the only thing the deploy job consumes, and
      # actions/deploy-pages can only read an artifact from its own run, which
      # is why the build lives here rather than in Validate.
      - run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub deploys one Pages build at a time; queue rather than cancel, so
    # the site never settles on an older build than the newest green commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
